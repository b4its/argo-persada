# ============================================================
# PRODUCTION / HOSTING VIA NGROK
# Jalankan: make ngrok-up
# DB + Nginx + PHP-FPM + Ngrok tunnel (domain default ngrok)
# ============================================================
services:
  db:
    image: mysql:8.4
    container_name: argo-prod-db
    environment:
      MYSQL_DATABASE: argopersada
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - argo-network

  php-fpm:
    build:
      context: .
      dockerfile: ./docker-nginx/Dockerfile
    container_name: argo-prod-php-fpm
    volumes:
      - .:/var/www/html
    networks:
      - argo-network

  nginx:
    image: nginx:alpine
    container_name: argo-prod-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker-nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm
    networks:
      - argo-network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: argo-prod-ngrok
    command: http --log=stdout http://nginx:80
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-3HZDiJ7rSHXNhr9I3bgeCgGljGl_XcHz3hoGrHH6MboApb2g}
    ports:
      - "4040:4040" # Web interface ngrok (untuk ambil URL via API)
    depends_on:
      - nginx
    networks:
      - argo-network

networks:
  argo-network:
    driver: bridge

volumes:
  mysql_data: